[open]
rules = [
  { type = ["text", "code", "config"], command = "hx", terminal = true },
]

[layout.panes]
places = 0
files = 45
preview = 45

[ui]
show_top_bar = false
show_hidden = true

[goto]
entries = [
  { title = "Repo root", command = "git rev-parse --show-toplevel", key = "r" },
  { title = "Workflow", command = "sh -c 'r=$(git rev-parse --show-toplevel) && echo \"$r/.workflow\"'", key = "w" },
]
