theme "catppuccin-mocha-custom"
input_mode "helix"
gutter_line_numbers_mode "absolute"

# Helix auto-format, trim-trailing-whitespace, trim-final-newlines.
enable_format_on_save true
trim_trailing_whitespace_on_save true
# Helix ends files with one newline. Flow "remove" strips it, so use "insert".
final_newline_on_save "insert"

# Helix auto-save on focus loss. No 3000 ms idle save, it would slow highlights.
enable_auto_save true
# Helix idle-timeout.
input_idle_time_ms 50

# Helix cursorline = false.
highlight_current_line false
highlight_current_line_gutter false

# Helix end-of-line-diagnostics. Flow has no severity filter, text sits after the line.
inline_diagnostics_alignment "left"

inline_vcs_blame true
inline_vcs_blame_alignment "left"

# Helix statusline. Flow's file widget fills the bar, so widgets after it sit right.
bottom_bar "mode lsp file log branch diagnostics selection linenumber:0,space,ascii,total"

# Helix file-picker hidden = false. Flow applies this to find in files only.
find_in_files_filter "hidden"
