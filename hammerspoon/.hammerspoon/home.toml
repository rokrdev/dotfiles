# settings
leader_key = "f18"        # required, the leader key that starts the sequence
leader_key_mods = ""      # optional, default "", not recommended - a dedicated leader key is better
                             # supports cmd ctrl alt shift
auto_reload = true        # optional, default true, reload when any file in this directory is saved
toast_on_reload = false    # optional, default false, show a toast when the config is reloaded
show_ui = true            # optional, default true, show the ui with your key maps

# Private transport shortcuts; bind the same chords to these commands in Tinycast.
s = ["shortcut:ctrl alt cmd shift 1", "Switch Windows"]

[a]
label = "Applications"
b = ["/Applications/Zen.app", "Browser"]
e = ["/Applications/Zed.app", "Editor"]
f = ["/System/Library/CoreServices/Finder.app", "Finder"]
i = ["/System/Volumes/Data/Applications/IntelliJ IDEA.app", "Idea"]
m = ["/Applications/Spotify.app", "Music"]
s = ["/Applications/Slack.app", "Slack"]
t = ["/Applications/Ghostty.app", "Terminal"]
y = ["/Applications/Things3.app", "Things"]
z = ["/System/Volumes/Preboot/Cryptexes/App/System/Applications/Safari.app", "Safari"]

[b]
label = "Browser"
b = ["shortcut:ctrl alt cmd shift b", "Bookmarks"]
h = ["shortcut:ctrl alt cmd shift h", "History"]

[r]
label = "Tinycast"
c = ["shortcut:ctrl alt cmd shift c", "Clipboard"]
e = ["shortcut:ctrl alt cmd shift e", "Emoji"]
k = ["shortcut:ctrl alt cmd shift k", "Kill Process"]
n = ["shortcut:ctrl alt cmd shift n", "Notes"]
s = ["shortcut:ctrl alt cmd shift s", "Snippets"]
w = ["shortcut:ctrl alt cmd shift d", "Word"]
R = "reload"
W = ["shortcut:ctrl alt cmd shift w", "Weather"]

[t]
label = "Things"
a = ["cmd:shortcuts run 'Things Anytime'", "Anytime"]
i = ["cmd:shortcuts run 'Things Inbox'", "Inbox"]
q = ["cmd:shortcuts run 'QT'", "Quick Todo"]
t = ["cmd:shortcuts run 'Things Today'", "Today"]
u = ["cmd:shortcuts run 'Things Upcoming'", "Upcoming"]
