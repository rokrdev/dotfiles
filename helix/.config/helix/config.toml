theme = "catppuccin_mocha"

[editor]
completion-timeout = 5
idle-timeout = 50
mouse = true
auto-save = true
cursorline = true
bufferline = "always"
color-modes	= true
# line-number = "relative"
rainbow-brackets = true
# rulers = [120]
# Minimum severity to show a diagnostic after the end of a line:
end-of-line-diagnostics = "hint"
auto-format = true
trim-final-newlines = true
trim-trailing-whitespace = true
popup-border = "all"

[editor.search]
sort-recent = true

[editor.cursor-shape]
insert = "bar"
normal = "block"
select = "underline"

[editor.file-picker]
hidden = false

[editor.indent-guides]
render = true
character = "▏" # Some characters that work well: "▏", "┆", "┊", "⸽"
skip-levels = 1

[editor.lsp]
auto-document-highlight = true
display-inlay-hints = false
display-progress-messages = true

[editor.soft-wrap]
enable = true
#wrap-at-text-width = true
wrap-indicator = "↩ "

[editor.inline-diagnostics]
# Minimum severity to show a diagnostic on the primary cursor's line.
# Note that `cursor-line` diagnostics are hidden in insert mode.
cursor-line = "warning"

[editor.inline-blame]
# Inline git blame (helix fork #13133). Comment out to revert to default (off).
show = "cursor-line"
auto-fetch = true
delay-ms = 250

[editor.statusline]
left = [ "mode", "spinner", "file-name", "read-only-indicator", "file-modification-indicator", "version-control", "diagnostics" ]
right = [ "primary-selection-length", "register", "position", "position-percentage", "total-line-numbers", "file-encoding" ]
separator = "│"
mode.normal = "N"
mode.insert = "I"
mode.select = "S"

[keys.normal]
X = ["extend_line_up", "extend_to_line_bounds"]

[keys.normal.space.g]
label = "Custom"
c = "changed_file_picker"
f = { label = "Search and Replace", command = [":write-all", ":insert-output scooter --no-stdin >/dev/tty", ":redraw", ":reload-all"] }
g = { label = "GitUI", command = [":write-all", ":sh gitui-herdr", ":redraw"] }
n = { label = "Files", command = [
  ':sh rm -f /tmp/unique-file',
  ':insert-output yazi "%{buffer_name}" --chooser-file=/tmp/unique-file',
  ':sh printf "\x1b[?1049h\x1b[?2004h\x1b[?1002h\x1b[?1006h" > /dev/tty',
  ':open %sh{cat /tmp/unique-file}',
  ':redraw',
] }
r = { label = "Reload File", command = [":reload"] }
R = { label = "Reload Config", command = [":config-reload"] }
w = { label = "LSP Commands", command = ":lsp-workspace-command" }
y = { label = "Copy Path", command = [":noop %sh{echo \"%{buffer_name}:%{cursor_line}\" | pbcopy}"] }
S = { label = "Speak", command = [":pipe-to ~/.local/bin/say-selection"] }

[keys.normal.space.g.m]
label = "Markdown Preview"
o = { label = "Open", command = [":insert-output ~/.local/bin/glowm-preview %{file_path_absolute} >/dev/tty 2>&1", ":redraw"] }
c = { label = "Close", command = [":insert-output ~/.local/bin/glowm-preview --close >/dev/tty 2>&1", ":redraw"] }
