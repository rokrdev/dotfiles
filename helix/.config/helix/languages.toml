[[language]]
name = "toml"
auto-format = true
formatter = { command = "prettier", args = ["--parser", "toml"] }

[[language]]
auto-format = true
name = "json"
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }

[[language]]
name = "javascript"
auto-format = true
language-servers = ["vtsls"]


[[language]]
name = "markdown"
auto-format = true
formatter = { command = "dprint", args = ["fmt", "--stdin", "md"] }
language-servers = ["marksman"]

[[language]]
name = "yaml"
auto-format = true
# indent = { tab-width = 2, unit = "  " }
formatter = { command = "dprint", args = ["fmt", "--stdin", "yaml"] }

[[language]]
name = "lua"
auto-format = true
formatter = { command = "stylua", args = ["-"] }

[language-server.lua-language-server.config.Lua]
diagnostics = { globals = [ "vim", "hs" ] }

[language-server.basedpyright]
command = "basedpyright-langserver"
args = ["--stdio"]

[language-server.basedpyright.config.basedpyright.analysis]
pythonPath = "~/.asdf/shims/python"

[[language]]
name = "python"
scope = "source.python"
indent = { tab-width = 4, unit  = "    " }
auto-format = true
language-servers = ["basedpyright", "ruff"]

[[language]]
name = "csv"
file-types = ["csv"]
scope = "source.csv"

[[grammar]]
name = "csv"
source.git = "https://github.com/weartist/rainbow-csv-tree-sitter"
source.rev = "896e6d09b23a1b0d87e45bf97ca34a249f41495c"

[language-server]
deno = { command = "deno", args = [ "lsp" ]}
emmet-ls = { command = "emmet-ls", args = [ "--stdio" ]}

[language-server.eslint]
command = "vscode-eslint-language-server"
args = ["--stdio"]

[language-server.eslint.config]
codeActionsOnSave = { mode = "all", "source.fixAll.eslint" = true }
format = { enable = true }
nodePath = ""
quiet = false
rulesCustomizations = []
run = "onType"
validate = "on"
experimental = {}
problems = { shortenToSingleLine = false }

[language-server.eslint.config.codeAction]
disableRuleComment = { enable = true, location = "separateLine" }
showDocumentation = { enable = false }

[language-server.vscode-json-language-server.config]
json = { validate = { enable = true }, format = { enable = true } }
provideFormatter = true

[language-server.vscode-css-language-server.config]
css = { validate = { enable = true } }
scss = { validate = { enable = true } }
less = { validate = { enable = true } }
provideFormatter = true

[language-server.vtsls]
command = "vtsls"
args = ["--stdio"]
config.hostInfo = "helix"

[language-server.vtsls.config.typescript]
updateImportsOnFileMove = { enabled = "always" }
suggest = { completeFunctionCalls = true }
tsserver = { experimental = { enableProjectDiagnostics = true } }
tsdk = "~/.bun/install/global/node_modules/typescript/lib"

[[language]]
name = "typescript"
language-servers = [ "vtsls", "eslint", "emmet-ls" ]
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
# formatter = { command = "dprint", args = [ "fmt", "--stdin", "typescript" ] }
auto-format = true

[[language]]
name = "tsx"
language-servers = [ "vtsls", "eslint", "emmet-ls" ]
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
# formatter = { command = "dprint", args = [ "fmt", "--stdin", "tsx" ] }
auto-format = true

[[language]]
name = "javascript"
language-servers = [ "vtsls", "eslint", "emmet-ls" ]
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
# formatter = { command = "dprint", args = [ "fmt", "--stdin", "javascript" ] }
auto-format = true

[[language]]
name = "jsx"
language-servers = [ "vtsls", "eslint", "emmet-ls" ]
formatter = { command = "prettier", args = [ "--parser", "typescript" ] }
# formatter = { command = "dprint", args = [ "fmt", "--stdin", "jsx" ] }
auto-format = true

[[language]]
name = "json"
formatter = { command = "dprint", args = ["fmt", "--stdin", "json"] }
auto-format = true

[[language]]
name = "html"
language-servers = [ "vscode-html-language-server", "emmet-ls" ]
formatter = { command = 'prettier', args = ["--parser", "html"] }
auto-format = true

[[language]]
name = "css"
language-servers = [ "vscode-css-language-server", "emmet-ls" ]
formatter = { command = 'prettier', args = ["--parser", "css"] }
auto-format = true

[[language]]
name = "kotlin"
# kmp-lsp disabled for now (was: language-servers = ["intellij", "kmp-lsp"])
language-servers = ["intellij"]

[[language]]
name = "java"
roots = [".git", "pom.xml", "build.gradle", "build.gradle.kts"]
# kmp-lsp disabled for now (was: language-servers = ["intellij", "kmp-lsp"])
language-servers = ["intellij"]

# JetBrains IntelliJ engine as LSP (preview builds expire ~30 days after build date;
# re-run scripts/install-intellij-server.sh when the engine stops, then :lsp-restart)
[language-server.intellij]
command = "/Users/bharat/.local/share/jetbrains-intellij-server/extension/server/bin/intellij-server"
args = ["--stdio", "--system-path", "/Users/bharat/.cache/intellij-server"]
timeout = 120
config = { eulaHash = "34d850193ee04897", intellijExtensions = true, defaultSdk = "/Users/bharat/.local/share/jetbrains-intellij-server/extension/server/jbr/Contents/Home", projects = [] }

# kmp-lsp was the second server: IntelliJ is pull-diagnostics-only (no publishDiagnostics),
# so kmp-lsp provided squiggles while IntelliJ did completion/hover/refactorings.
# DISABLED for now (2026-08-10). Uncomment to restore:
# [language-server.kmp-lsp]
# command = "kmp-lsp"
