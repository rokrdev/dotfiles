onboarding = false

[update]
channel = "stable"
version_check = true
manifest_check = true

[terminal]
default_shell = "fish"
shell_mode = "auto"
new_cwd = "follow"

[keys]
prefix = "ctrl+b"
switch_tab = "prefix+1..9"
switch_workspace = "prefix+ctrl+1..9"
focus_agent = "prefix+shift+1..9"

[[keys.command]]
key = "prefix+ctrl+g"
type = "pane"
command = "gitui"
description = "run gitui"

[[keys.command]]
key = "prefix+ctrl+t"
type = "plugin_action"
command = "herdr-navigator.open"
description = "jump to anything"

[[keys.command]]
key = "prefix+ctrl+d"
type = "pane"
command = "fish -c 'cd ~/Documents/rokr_vault; hx index.md'"
description = "vault"

[theme]
name = "catppuccin"
auto_switch = false

# Explicitly pin the palette to Catppuccin Mocha (herdr's built-in
# "catppuccin" theme resolves to Mocha; these tokens make the match explicit).
[theme.custom]
accent = "#89b4fa"
panel_bg = "#181825"
sidebar_bg = "#1e1e2e"
surface0 = "#313244"
surface1 = "#45475a"
surface_dim = "#1e1e2e"
overlay0 = "#6c7086"
overlay1 = "#7f849c"
text = "#cdd6f4"
subtext0 = "#a6adc8"
mauve = "#cba6f7"
green = "#a6e3a1"
yellow = "#f9e2af"
red = "#f38ba8"
blue = "#89b4fa"
teal = "#94e2d5"
peach = "#fab387"

[ui]
sidebar_width = 26
sidebar_collapsed_mode = "compact"
mouse_capture = true
confirm_close = true
pane_borders = true
pane_gaps = false
hide_tab_bar_when_single_tab = true
accent = "blue"
show_agent_labels_on_pane_borders = true
prompt_new_tab_name = true
pane_scrollbars = false
tab_bar_position = "top"

[ui.toast]
delivery = "herdr"

[ui.toast.herdr]
position = "bottom-left"

[ui.sound]
enabled = true

[advanced]
scrollback_limit_bytes = 10485760

[session]
resume_agents_on_restore = true

[experimental]
kitty_graphics = true
