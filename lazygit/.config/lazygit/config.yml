gui:
  # Set initial screen mode: 'normal' (default), 'half', or 'full'
  screenMode: half

  # Control split direction in half-screen mode: 'left' (default) or 'top'
  enlargedSideViewLocation: left

  nerdFontsVersion: "3"
  # Catppuccin Mocha lavender, from catppuccin/lazygit themes/mocha/lavender.yml.
  theme:
    activeBorderColor:
      - "#b4befe"
      - bold
    inactiveBorderColor:
      - "#a6adc8"
    searchingActiveBorderColor:
      - "#f9e2af"
    optionsTextColor:
      - "#89b4fa"
    selectedLineBgColor:
      - "#313244"
    inactiveViewSelectedLineBgColor:
      - "#6c7086"
    cherryPickedCommitFgColor:
      - "#b4befe"
    cherryPickedCommitBgColor:
      - "#45475a"
    markedBaseCommitFgColor:
      - "#89b4fa"
    markedBaseCommitBgColor:
      - "#f9e2af"
    unstagedChangesColor:
      - "#f38ba8"
    defaultFgColor:
      - "#cdd6f4"
    authorColors:
      "*": "#b4befe"
